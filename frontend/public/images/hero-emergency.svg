<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#232323"/>
    </linearGradient>
    <radialGradient id="aquaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Map Grid Lines -->
  <g stroke="#2E2E2E" stroke-width="1.5">
    <line x1="50" y1="50" x2="550" y2="50"/>
    <line x1="50" y1="120" x2="550" y2="120"/>
    <line x1="50" y1="190" x2="550" y2="190"/>
    <line x1="50" y1="260" x2="550" y2="260"/>
    <line x1="50" y1="330" x2="550" y2="330"/>
    <line x1="120" y1="30" x2="120" y2="370"/>
    <line x1="220" y1="30" x2="220" y2="370"/>
    <line x1="320" y1="30" x2="320" y2="370"/>
    <line x1="420" y1="30" x2="420" y2="370"/>
    <line x1="520" y1="30" x2="520" y2="370"/>
  </g>

  <!-- Route Line -->
  <path d="M 160 280 Q 250 180 340 220 T 460 140" fill="none" stroke="#00F0FF" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Radar Glow -->
  <circle cx="460" cy="140" r="70" fill="url(#aquaGlow)"/>

  <!-- Technician Marker -->
  <g transform="translate(160, 280)">
    <circle cx="0" cy="0" r="24" fill="#00F0FF" filter="drop-shadow(0 0 10px #00F0FF)"/>
    <text x="0" y="8" font-size="20" text-anchor="middle" fill="#000">⚡</text>
  </g>

  <!-- Incident / Citizen Marker -->
  <g transform="translate(460, 140)">
    <circle cx="0" cy="0" r="26" fill="#FF3333" filter="drop-shadow(0 0 12px #FF3333)"/>
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="#FF3333"/>
  </g>

  <!-- Live ETA HUD Box -->
  <g transform="translate(240, 60)">
    <rect width="200" height="60" rx="10" fill="#121212" stroke="#00F0FF" stroke-width="2"/>
    <text x="20" y="26" fill="#858585" font-family="sans-serif" font-size="12" font-weight="600">LIVE EMERGENCY DISPATCH</text>
    <text x="20" y="48" fill="#00F0FF" font-family="sans-serif" font-size="18" font-weight="900">ETA: 4 MIN (0.8 KM)</text>
  </g>
</svg>

